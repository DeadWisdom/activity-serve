[project]
name = "activity-serve"
version = "0.1.0"
description = "ActivityPub-compatible server built with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "structlog>=23.2.0",
    "nanoid>=2.0.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.6",
    "firebase-admin>=6.9.0",
    "pyld>=2.0.4",
    "hishel>=0.0.31",
    "orjson>=3.9.0",
    "redis>=7.3.0",
    "elasticsearch>=9.3.0",
]

[project.optional-dependencies]
redis = [
    "redis[hiredis]>=5.0.0",
]
es = [
    "elasticsearch[async]>=8.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.4.0",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
